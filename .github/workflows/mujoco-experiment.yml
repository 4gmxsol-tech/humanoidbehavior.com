name: MuJoCo Experiment
on:
  workflow_dispatch:
    inputs:
      seeds:
        description: Comma-separated reproducible seeds
        required: true
        default: "42,1337,2026,7,99"
      seconds:
        description: Simulation duration per run
        required: true
        default: "5"
jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r simulation/requirements.txt
      - name: Run and validate experiment
        env:
          EXPERIMENT_SEEDS: ${{ inputs.seeds }}
          EXPERIMENT_SECONDS: ${{ inputs.seconds }}
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Seeds: $EXPERIMENT_SEEDS"
          echo "Seconds: $EXPERIMENT_SECONDS"
          printf '{"seeds":"%s","seconds":%s}\n' "$EXPERIMENT_SEEDS" "$EXPERIMENT_SECONDS" | python simulation/experiment_manager.py | tee mujoco-experiment.json
          python - <<'PY'
          import json
          with open("mujoco-experiment.json", encoding="utf-8") as f:
              report = json.load(f)
          expected = len(report["seeds"]) * len(report["policies"])
          actual = len(report["rawResults"])
          assert report["measured"] is True, "Expected measured=true"
          assert report["engine"] == "MuJoCo", "Expected MuJoCo engine"
          assert report["validation"]["passed"] is True, "Experiment validation failed"
          assert actual == expected, f"Expected {expected} raw results, got {actual}"
          print(f"Validated experiment: {actual}/{expected} runs")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mujoco-experiment-${{ github.run_number }}
          path: |
            mujoco-experiment.json
            mujoco-experiment.md
