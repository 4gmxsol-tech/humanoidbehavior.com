name: MuJoCo Compute Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: humanoidbehavior-mujoco
  cancel-in-progress: false

jobs:
  run-queued-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MuJoCo dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r simulation/requirements.txt

      - name: Run one queued evaluation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: de530114-adc7-4c5a-b0de-cdc2e5379ed5
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python simulation/github_actions_runner.py
