name: MuJoCo Compute Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mujoco-worker.yml"
      - "simulation/github_actions_runner.py"
      - "simulation/behavior_task_worker.py"
permissions:
  contents: read

concurrency:
  group: humanoidbehavior-mujoco
  cancel-in-progress: false

jobs:
  run-queued-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MuJoCo dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r simulation/requirements.txt

      - name: Verify Cloudflare D1 token access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: de530114-adc7-4c5a-b0de-cdc2e5379ed5
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          HTTP_CODE=$(curl -sS -o /tmp/d1-response.json -w "%{http_code}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "D1 metadata HTTP status: ${HTTP_CODE}"
          cat /tmp/d1-response.json
          test "${HTTP_CODE}" = "200"

      - name: Verify D1 query access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: de530114-adc7-4c5a-b0de-cdc2e5379ed5
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          BODY='{"sql":"SELECT 1 AS ok"}'
          HTTP_CODE=$(curl -sS -o /tmp/d1-query-response.json -w "%{http_code}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data "${BODY}")
          echo "D1 query HTTP status: ${HTTP_CODE}"
          cat /tmp/d1-query-response.json
          test "${HTTP_CODE}" = "200"

      - name: Worker heartbeat
        run: echo "MuJoCo Compute Worker started at $(date -u +%FT%TZ)"

      - name: Process queued evaluations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: de530114-adc7-4c5a-b0de-cdc2e5379ed5
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python simulation/github_actions_runner.py
