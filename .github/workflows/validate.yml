name: Validate

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker.js"
      - "cloudflare-behavior-access.mjs"
      - "demo.html"
      - "sitemap.xml"
      - ".github/scripts/test_demo_replay_disclosure.mjs"
      - ".github/scripts/test_cloudflare_behavior_access.mjs"
      - "simulation/**/*.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "cloudflare-worker.js"
      - "cloudflare-behavior-access.mjs"
      - "demo.html"
      - "sitemap.xml"
      - ".github/scripts/test_demo_replay_disclosure.mjs"
      - ".github/scripts/test_cloudflare_behavior_access.mjs"
      - "simulation/**/*.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python
        run: python -m compileall -q simulation
      - name: Validate Worker JavaScript
        run: node --check cloudflare-worker.js
      - name: Validate imported behavior access module
        run: node --check cloudflare-behavior-access.mjs
      - name: Test Worker behavior read authorization
        run: node .github/scripts/test_cloudflare_behavior_access.mjs
      - name: Validate demo replay disclosure and non-interactive preview
        run: node .github/scripts/test_demo_replay_disclosure.mjs
