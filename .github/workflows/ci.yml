name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Node dependencies
        run: npm install
      - name: Validate public SEO sitemap pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const xml = fs.readFileSync('sitemap.xml', 'utf8');
          const urls = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map(match => match[1].trim());
          if (!urls.length) throw new Error('Sitemap contains no URLs');
          for (const value of urls) {
            const url = new URL(value);
            const pathname = decodeURIComponent(url.pathname);
            const file = pathname.endsWith('/') ? (pathname.slice(1) + 'index.html') : pathname.slice(1);
            if (!fs.existsSync(file)) throw new Error('Sitemap target missing: ' + value + ' -> ' + file);
            const html = fs.readFileSync(file, 'utf8');
            const title = (html.match(/<title[^>]*>([\s\S]*?)<\/title>/i) || [])[1]?.trim();
            const tags = html.match(/<link\b[^>]*>/gi) || [];
            const canonicalTag = tags.find(tag => /\brel=["']canonical["']/i.test(tag));
            const canonical = canonicalTag?.match(/\bhref=["']([^"']+)["']/i)?.[1];
            const metas = html.match(/<meta\b[^>]*>/gi) || [];
            const descriptionTag = metas.find(tag => /\bname=["']description["']/i.test(tag));
            const description = descriptionTag?.match(/\bcontent=["']([^"']*)["']/i)?.[1] || '';
            if (!title) throw new Error('Missing title: ' + value);
            if (canonical !== value) throw new Error('Canonical mismatch: ' + value + ' -> ' + canonical);
            if (description.trim().length < 70) throw new Error('Missing/short meta description (' + description.length + '): ' + value);
          }
          console.log('SEO validation passed for ' + urls.length + ' sitemap pages.');
          NODE
      - run: node --check api.js
      - run: node --check app.js
      - run: node --check benchmark-runner.js
      - run: node --check db.js
      - run: node --check worker.js
      - run: node api.test.js
      - run: node --check worker.js
      - run: node evaluation.test.js
      - run: node -e "const d=require('./data/behaviors.json'); if(!Array.isArray(d)||d.length<4) process.exit(1); for(const b of d){if(!b.id||!Array.isArray(b.steps)||!b.metrics) process.exit(1)}"
      - name: Start API and smoke test
        run: |
          set -euo pipefail
          rm -f /tmp/hb.log
          node api.js > /tmp/hb.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json; then break; fi
            if ! kill -0 $PID 2>/dev/null; then
              cat /tmp/hb.log
              exit 1
            fi
            sleep 0.25
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:3000/api/behaviors > /tmp/behaviors.json
          node -e "const d=require('./data/behaviors.json'); const r=require('/tmp/behaviors.json'); if(!r.count || r.count<4) throw new Error('Registry smoke test failed'); console.log('registry smoke test passed',r.count)"
          echo "--- API log ---"
          cat /tmp/hb.log
