name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check api.js
      - run: node --check app.js
      - run: node -e "const d=require('./data/behaviors.json'); if(!Array.isArray(d)||d.length<1) process.exit(1); for(const b of d){if(!b.id||!Array.isArray(b.steps)||!b.metrics) process.exit(1)}"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node api.js & sleep 1; curl -fsS http://127.0.0.1:3000/api/health; curl -fsS http://127.0.0.1:3000/api/behaviors > /dev/null