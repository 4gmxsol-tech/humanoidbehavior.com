name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Node dependencies
        run: npm install
      - run: node --check api.js
      - run: node --check app.js
      - run: node --check benchmark-runner.js
      - run: node --check db.js
      - run: node --check worker.js
      - run: node api.test.js
      - run: node --check worker.js
      - run: node evaluation.test.js
      - run: node -e "const d=require('./data/behaviors.json'); if(!Array.isArray(d)||d.length<4) process.exit(1); for(const b of d){if(!b.id||!Array.isArray(b.steps)||!b.metrics) process.exit(1)}"
      - name: Start API and smoke test
        run: |
          set -euo pipefail
          rm -f /tmp/hb.log
          node api.js > /tmp/hb.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json; then break; fi
            if ! kill -0 $PID 2>/dev/null; then
              cat /tmp/hb.log
              exit 1
            fi
            sleep 0.25
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:3000/api/behaviors > /tmp/behaviors.json
          node -e "const d=require('./data/behaviors.json'); const r=require('/tmp/behaviors.json'); if(!r.count || r.count<4) throw new Error('Registry smoke test failed'); console.log('registry smoke test passed',r.count)"
          echo "--- API log ---"
          cat /tmp/hb.log
