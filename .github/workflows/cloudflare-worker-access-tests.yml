name: Cloudflare Worker access tests

on:
  pull_request:
    paths:
      - "cloudflare-worker.js"
      - "cloudflare-behavior-access.mjs"
      - "cloudflare-behavior-access.test.mjs"
      - ".github/workflows/cloudflare-worker-access-tests.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare-worker.js"
      - "cloudflare-behavior-access.mjs"
      - "cloudflare-behavior-access.test.mjs"
      - ".github/workflows/cloudflare-worker-access-tests.yml"

permissions:
  contents: read

jobs:
  behavior-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Cloudflare behavior read and evaluation authorization
        run: node cloudflare-behavior-access.test.mjs
