<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experiment — HumanoidBehavior</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><nav><a href="behaviors.html">Behaviors</a><a class="active" href="benchmark.html">Benchmark</a><a href="simulation.html">Simulation</a><a href="dashboard.html">Workspace</a></nav></header><main class="page"><div class="eyebrow">EXPERIMENT REPORT</div><h1 id="title">Loading experiment…</h1><p class="lead" id="meta"></p><div id="summary" class="metric-grid"></div><div class="builder-result"><h2>Policy comparison</h2><div id="comparison"></div><canvas id="chart" height="180"></canvas></div><div class="builder-result"><h2>Run matrix</h2><div id="runs"></div></div><details class="builder-result"><summary>Raw experiment JSON</summary><pre id="raw" style="overflow:auto"></pre></details></main><script>
const token=localStorage.getItem("hb_token"),id=new URLSearchParams(location.search).get("id");const api=async u=>{const r=await fetch(u,{headers:token?{Authorization:"Bearer "+token}:{}});const x=await r.json();if(!r.ok)throw Error(x.error||"Request failed");return x};
function drawChart(r){const c=document.getElementById("chart"),ctx=c.getContext("2d"),w=c.width=c.clientWidth*2,h=c.height=360;ctx.clearRect(0,0,w,h);const vals=r.policies.map(p=>r.summary[p].survival_rate.mean),max=Math.max(.001,...vals);ctx.font="28px sans-serif";vals.forEach((v,i)=>{const x=80+i*(w-160)/vals.length,bar=(h-100)*v/max;ctx.fillRect(x,h-70-bar,Math.min(160,w/3),bar);ctx.fillText(r.policies[i],x,h-30);ctx.fillText(v.toFixed(4),x,h-85-bar)})}
async function load(){try{let x;if(id)x=await api("/api/experiments/"+encodeURIComponent(id));else{const d=await api("/api/experiments");x=d.data?.[0]}if(!x)throw Error("No experiment found");const r=x.result||x;document.getElementById("title").textContent=r.benchmark||x.benchmark||"Experiment";document.getElementById("meta").textContent=`${x.status||r.status||"completed"} · ${r.engine||x.engine} · ${r.runCount||0}/${r.expectedRunCount||0} runs · ${r.targetSeconds||"-"}s · ${x.createdAt||""}`;document.getElementById("summary").innerHTML=(r.policies||[]).map(p=>{const s=r.summary[p];return `<div><strong>${s.survival_rate.mean.toFixed(4)}</strong><span>${p} survival mean</span></div><div><strong>${s.control_cost.mean.toFixed(5)}</strong><span>${p} control cost</span></div><div><strong>${(s.fallRate*100).toFixed(0)}%</strong><span>${p} fall rate</span></div>`}).join("");document.getElementById("comparison").innerHTML=(r.policies||[]).map(p=>{const s=r.summary[p];return `<p><b>${p}</b> — survival 95% CI: ${s.survival_rate.ci95.low}–${s.survival_rate.ci95.high}; max tilt mean: ${s.max_tilt_rad.mean}; simulated seconds mean: ${s.simulated_seconds.mean}</p>`}).join("");document.getElementById("runs").innerHTML=(r.rawResults||[]).map(v=>`<div class="run-row"><span>${v.seed}</span><span>${v.policy}</span><span>${v.metrics.survivalRate}</span><span>${v.metrics.simulatedSeconds}s</span><strong>${v.metrics.fell?"fell":"survived"}</strong></div>`).join("");document.getElementById("raw").textContent=JSON.stringify(x,null,2);drawChart(r)}catch(e){document.getElementById("title").textContent=e.message}}load();</script></body></html>
