async function loadBrowserComputeModule(){
  const url=new URL("browser-compute.js?v=21",location.href).toString();
  const response=await fetch(url,{cache:"no-store",headers:{"Accept":"text/javascript"}});
  const source=await response.text();
  if(!response.ok)throw new Error("browser-compute.js HTTP "+response.status);
  if(!source.includes("export async function runBrowserEvaluation"))throw new Error("browser-compute.js returned non-module content");
  const blob=new Blob([source],{type:"text/javascript"});
  return await import(URL.createObjectURL(blob));
}
async function runBrowserCompute(payload){
  let workerError="";
  try{
    const worker=new Worker("./browser-compute-worker.js?v=21",{type:"module"});
    return await new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>{worker.terminate();reject(new Error("Browser compute timed out after 2 minutes"));},120000);
      worker.onmessage=event=>{const m=event.data||{};if(m.type==="complete"){clearTimeout(timer);worker.terminate();resolve(m.result)}if(m.type==="error"){clearTimeout(timer);worker.terminate();reject(new Error(m.message||"Browser compute failed"))}};
      worker.onerror=event=>{workerError=event.message||"Worker module could not start";clearTimeout(timer);worker.terminate();reject(new Error(workerError))};
      worker.postMessage(payload);
    });
  }catch(firstError){
    const first=String(firstError?.message||firstError||"Worker failed");
    try{
      const mod=await loadBrowserComputeModule();
      return await mod.runBrowserEvaluation(payload);
    }catch(secondError){
      throw new Error(first+"; direct browser fallback: "+String(secondError?.message||secondError||"failed"));
    }
  }
}

mary?.taskSuccessRate||0)*100).toFixed(1))+"%</strong><span>Task success</span></div><div><strong>"+n(r.summary?.completionTime?.mean)+"s</strong><span>Completion time</span></div><div><strong>"+n(r.summary?.controlCost?.mean)+"</strong><span>Control cost</span></div>";document.getElementById("comparison").innerHTML="<h2>Measured browser evaluation</h2><p>MuJoCo WASM · Generic reference model · "+esc(r.behaviorId||"behavior")+" · Behavior "+esc(r.behaviorVersion||"1.0.0")+"</p><p><b>Worker:</b> "+esc(r.provenance?.worker||"browser-mujoco-wasm")+" · <b>Runs:</b> "+(r.runCount||0)+"</p><div class=\"run-table\"><div class=\"run-row head\"><span>Seed</span><span>Policy</span><span>Success</span><span>Completion</span></div>"+(r.rawResults||[]).map(v=>"<div class=\"run-row\"><span>"+esc(v.seed)+"</span><span>"+esc(v.policy)+"</span><span>"+(v.metrics?.taskSuccess?"✓ Success":"✗ Failure")+"</span><span>"+n(v.metrics?.completionTime)+"s</span></div>").join("")+"</div>";document.getElementById("raw").textContent=JSON.stringify(x,null,2);return}if(r.comparisonType==="robot-behavior-evaluation"){document.getElementById("summary").innerHTML='<div><strong>'+((Number(r.successRate||0)*100).toFixed(1))+'%</strong><span>Task success</span></div><div><strong>'+n(r.summary?.completionTimeMean)+'s</strong><span>Completion time</span></div><div><strong>'+n(r.summary?.controlCostMean)+'</strong><span>Control cost</span></div><div><strong>'+n(r.summary?.maxTiltRadMean)+'</strong><span>Max tilt</span></div><div><strong>'+n(r.summary?.collisionCountMean)+'</strong><span>Collisions</span></div>';document.getElementById("comparison").innerHTML='<h2>Measured evaluation</h2><p>MuJoCo · Generic reference model · Pick & Place · Behavior '+esc(r.behaviorVersion||"1.0.0")+'</p><p><b>Reproducibility:</b> '+(r.reproducible?"verified":"—")+' · <b>Runs:</b> '+(r.runCount||0)+'</p><div class="run-table"><div class="run-row head"><span>Seed</span><span>Policy</span><span>Success</span><span>Completion<
