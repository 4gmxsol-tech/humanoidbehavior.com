<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experiment — HumanoidBehavior</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><nav><a href="behaviors.html">Behaviors</a><a class="active" href="benchmark.html">Benchmark</a><a href="simulation.html">Simulation</a><a href="dashboard.html">Workspace</a></nav></header><main class="page"><div class="eyebrow">EXPERIMENT REPORT</div><h1 id="title">Loading experiment…</h1><p class="lead" id="meta"></p><div id="summary" class="metric-grid"></div><div id="comparison" class="builder-result"></div><div class="builder-result"><h2>Policy comparison</h2><div id="policy"></div><canvas id="chart" height="180"></canvas></div><div class="builder-result"><h2>Run matrix</h2><div id="runs"></div></div><details class="builder-result"><summary>Raw experiment JSON</summary><pre id="raw" style="overflow:auto"></pre></details></main><script>
const token=localStorage.getItem("hb_token"),id=new URLSearchParams(location.search).get("id");const api=async u=>{const r=await fetch(u,{headers:token?{Authorization:"Bearer "+token}:{}});const x=await r.json();if(!r.ok)throw Error(x.error||"Request failed");return x};const n=v=>typeof v==="number"?v.toFixed(4):"—";function drawChart(r){const c=document.getElementById("chart"),ctx=c.getContext("2d"),w=c.width=c.clientWidth*2,h=c.height=360;ctx.clearRect(0,0,w,h);const vals=(r.policies||[]).map(p=>Number(r.summary?.[p]?.survival_rate?.mean??0));const max=Math.max(.001,...vals);ctx.font="28px sans-serif";vals.forEach((v,i)=>{const x=80+i*(w-160)/Math.max(1,vals.length),bar=(h-100)*v/max;ctx.fillRect(x,h-70-bar,Math.min(160,w/3),bar);ctx.fillText(r.policies[i],x,h-30);ctx.fillText(v.toFixed(4),x,h-85-bar)})}
async function load(){try{let x;if(id)x=await api("/api/experiments/"+encodeURIComponent(id));else{const d=await api("/api/experiments");x=d.data?.[0]}if(!x)throw Error("No experiment found");if(["queued","running"].includes(x.status)){document.getElementById("title").textContent="Experiment "+x.status+"…";document.getElementById("meta").textContent="Worker processing. Refreshing automatically.";setTimeout(load,2000);return}const r=x.result||x;document.getElementById("title").textContent=r.comparisonType==="behavior-version-vs-version"?"Behavior version comparison":(r.benchmark||x.benchmark||"Experiment");document.getElementById("meta").textContent=`${x.status||r.status||"completed"} · ${r.engine||x.engine} · ${r.runCount||0}/${r.expectedRunCount||0} runs · ${r.targetSeconds||"-"}s`;if(r.comparisonType==="behavior-version-vs-version"){document.getElementById("summary").innerHTML=(r.versions||[]).map(v=>{const s=r.summary?.[v]||{};return `<div><strong>${n(s.taskSuccessRate)}</strong><span>${v} task success</span></div><div><strong>${n(s.controlCost?.mean)}</strong><span>${v} control cost</span></div><div><strong>${n(s.survivalRate?.mean)}</strong><span>${v} survival mean</span></div>`}).join("");document.getElementById("comparison").innerHTML=`<h2>Version comparison</h2><p>Delta = ${r.versions?.[1]||"B"} − ${r.versions?.[0]||"A"}.</p><table><thead><tr><th>Metric</th><th>Mean Δ</th><th>Stddev</th><th>95% CI</th></tr></thead><tbody>${Object.entries(r.deltaSummary||{}).map(([k,v])=>`<tr><td>${k}</td><td>${n(v.mean)}</td><td>${n(v.stddev)}</td><td>[${n(v.ci95?.low)}, ${n(v.ci95?.high)}]</td></tr>`).join("")}</tbody></table>`;document.getElementById("policy").innerHTML=`<h2>Paired runs</h2><table><thead><tr><th>Seed</th><th>Policy</th><th>Task Δ</th><th>Cost Δ</th><th>Time Δ</th><th>Survival Δ</th></tr></thead><tbody>${(r.pairedDeltas||[]).map(v=>`<tr><td>${v.seed}</td><td>${v.policy}</td><td>${n(v.taskSuccessDelta)}</td><td>${n(v.controlCostDelta)}</td><td>${n(v.completionTimeDelta)}</td><td>${n(v.survivalRateDelta)}</td></tr>`).join("")}</tbody></table>`;document.getElementById("runs").innerHTML=(r.rawResults||[]).map(v=>`<div class="run-row"><span>${v.behaviorVersion} · ${v.seed}</span><span>${v.policy}</span><span>${v.metrics.taskSuccess?"success":"failure"}</span><span>${n(v.metrics.controlCost)}</span><strong>${v.metrics.completionTime??"—"}s</strong></div>`).join("");return}document.getElementById("summary").innerHTML=(r.policies||[]).map(p=>{const s=r.summary[p]||{};return `<div><strong>${n(s.survival_rate?.mean)}</strong><span>${p} survival mean</span></div><div><strong>${n(s.control_cost?.mean)}</strong><span>${p} control cost</span></div><div><strong>${(Number(s.fallRate??0)*100).toFixed(0)}%</strong><span>${p} fall rate</span></div>`}).join("");document.getElementById("policy").innerHTML=(r.policies||[]).map(p=>{const s=r.summary[p]||{};return `<p><b>${p}</b> — survival 95% CI: ${n(s.survival_rate?.ci95?.low)}–${n(s.survival_rate?.ci95?.high)}; max tilt mean: ${n(s.max_tilt_rad?.mean)}</p>`}).join("");document.getElementById("runs").innerHTML=(r.rawResults||[]).map(v=>`<div class="run-row"><span>${v.seed}</span><span>${v.policy}</span><span>${n(v.metrics.survivalRate)}</span><span>${n(v.metrics.simulatedSeconds)}s</span><strong>${v.metrics.fell?"fell":"survived"}</strong></div>`).join("");drawChart(r);document.getElementById("raw").textContent=JSON.stringify(x,null,2)}catch(e){document.getElementById("title").textContent=e.message}}load();</script></body></html>
