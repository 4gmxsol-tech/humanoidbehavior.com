<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulation Benchmark</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><nav><a href="behaviors.html">Behaviors</a><a href="benchmark.html">Benchmark</a><a href="builder.html">Builder</a><a href="docs.html">Docs</a></nav><a class="nav-cta" href="dashboard.html">Workspace</a></header><main class="page"><div class="eyebrow">SIMULATION LAB</div><h1>Run a benchmark.</h1><p class="lead">Execute a deterministic simulation harness now. Later, the same job contract can be routed to MuJoCo, Isaac Lab or Gazebo.</p><div class="builder-result"><label>Behavior</label><select id="behavior" class="toolbar"><option value="pick-place">Pick & Place</option><option value="open-door">Open a Door</option><option value="follow-person">Follow a Person</option><option value="handover">Hand Object to Person</option></select><label>Model / Policy</label><input id="model" value="baseline-policy" style="width:100%;padding:12px;border:1px solid #d5d8dd;border-radius:8px;margin:8px 0 20px"><label>Environment</label><input id="env" value="humanoid-lab-v1" style="width:100%;padding:12px;border:1px solid #d5d8dd;border-radius:8px;margin:8px 0 20px"><button class="button primary" id="run">Run Simulation Benchmark</button><pre id="out" style="margin-top:25px;background:#111318;color:#e5e7ea;padding:22px;border-radius:10px;overflow:auto">Ready.</pre></div></main><script>
document.getElementById("run").onclick=async()=>{const out=document.getElementById("out");out.textContent="Running...";try{const token=localStorage.getItem("hb_token");const r=await fetch("/api/simulation",{method:"POST",headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:JSON.stringify({behaviorId:document.getElementById("behavior").value,model:document.getElementById("model").value,environment:document.getElementById("env").value,seed:"demo-1"})});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=e.message}};
</script></body></html>
