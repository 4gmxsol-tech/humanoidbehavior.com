<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experiment Lab — HumanoidBehavior</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><nav><a href="behaviors.html">Behaviors</a><a href="benchmark.html">Benchmark</a><a class="active" href="simulation.html">Simulation</a><a href="builder.html">Builder</a><a href="docs.html">Docs</a></nav><a class="nav-cta" href="dashboard.html">Workspace</a></header><main class="page"><div class="eyebrow">EXPERIMENT LAB</div><h1>Run an experiment.</h1><p class="lead">Launch a reproducible multi-seed comparison. MuJoCo experiments are executed by the dedicated worker; the deterministic harness is available for fast local validation.</p><div class="builder-result"><label>Behavior</label><select id="behavior" style="width:100%;padding:12px;margin:8px 0 18px"><option value="pick-place">Pick & Place</option><option value="open-door">Open a Door</option><option value="follow-person">Follow a Person</option><option value="handover">Hand Object to Person</option></select><label>Robot embodiment</label><select id="robot" style="width:100%;padding:12px;margin:8px 0 18px"><option value="">Generic behavior evaluation</option><option value="unitree-g1">Unitree G1 — Menagerie</option></select><label>G1 Behavior</label><select id="g1behavior" style="width:100%;padding:12px;margin:8px 0 18px"><option value="">Stand / generic evaluation</option><option value="pick-place">Pick & Place — measured embodiment</option></select><label>Seeds</label><input id="seeds" value="42,1337,2026,7,99" style="width:100%;padding:12px;border:1px solid #d5d8dd;border-radius:8px;margin:8px 0 18px"><label>Engine</label><select id="engine" style="width:100%;padding:12px;margin:8px 0 18px"><option value="MuJoCo">MuJoCo — measured simulation</option><option value="simulation-harness">Deterministic harness</option></select><label>Seconds</label><input id="seconds" type="number" min="1" max="60" value="5" style="width:100%;padding:12px;border:1px solid #d5d8dd;border-radius:8px;margin:8px 0 20px"><button class="button primary" id="run">Run Experiment</button><pre id="out" style="margin-top:25px;background:#111318;color:#e5e7ea;padding:22px;border-radius:10px;overflow:auto">Ready.</pre><p id="link"></p></div></main><script>
document.getElementById("run").onclick=async()=>{const out=document.getElementById("out"),link=document.getElementById("link"),token=localStorage.getItem("hb_token");if(!token){out.textContent="Please sign in to run an experiment.";return}out.textContent="Running…";link.textContent="";try{const robot=document.getElementById("robot").value;const g1behavior=document.getElementById("g1behavior").value;const endpoint=g1behavior&&robot?"/api/robots/"+encodeURIComponent(robot)+"/behaviors/"+g1behavior:(robot?"/api/robots/"+encodeURIComponent(robot)+"/evaluate":"/api/experiments/run");const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({behaviorId:document.getElementById("behavior").value,engine:document.getElementById("engine").value,seeds:document.getElementById("seeds").value.split(",").map(x=>x.trim()).filter(Boolean),seconds:Number(document.getElementById("seconds").value)})});const x=await r.json();if(!r.ok)throw Error(x.error||"Experiment failed");out.textContent=`Queued · ${x.engine} · ${x.result?.expectedRunCount||0} runs`;link.innerHTML='<a class="button primary" href="experiment.html?id='+encodeURIComponent(x.id)+'">Open experiment report</a>'}catch(e){out.textContent=e.message}};</script></body></html>
