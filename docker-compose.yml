services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://humanoid:humanoid@postgres:5432/humanoidbehavior
      DATABASE_SSL: "false"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      SIM_WORKER_COMMAND: ${SIM_WORKER_COMMAND:-}
    depends_on: [postgres]
    healthcheck:
      test: ["CMD","wget","-qO-","http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["node","worker.js"]
    environment:
      DATABASE_URL: postgresql://humanoid:humanoid@postgres:5432/humanoidbehavior
      DATABASE_SSL: "false"
      WORKER_POLL_MS: 1000
      MUJOCO_PYTHON: python3
    depends_on: [postgres]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: humanoidbehavior
      POSTGRES_USER: humanoid
      POSTGRES_PASSWORD: humanoid
    ports: ["5432:5432"]
    volumes: [hb_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U humanoid -d humanoidbehavior"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  hb_pg:
