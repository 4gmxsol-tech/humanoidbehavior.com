<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared Report — HumanoidBehavior</title><link rel="stylesheet" href="styles.css"><script src="api-base.js"></script></head><body><header class="nav"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><nav><a href="behaviors.html">Behaviors</a><a href="simulation.html">Simulation</a><a href="pricing.html">Plans</a></nav></header><main class="page"><div class="eyebrow">SHARED EVALUATION REPORT</div><h1 id="title">Loading…</h1><p class="lead" id="meta"></p><div id="summary" class="metric-grid"></div><section class="builder-result"><h2>Evaluation details</h2><div id="details"></div></section><section class="builder-result"><h2>Reproducibility &amp; provenance</h2><div id="provenance"></div><div class="toolbar"><button class="button secondary" id="download-csv">Download CSV</button></div></section><details class="builder-result"><summary>Raw report JSON</summary><pre id="raw" style="overflow:auto"></pre></details></main><script>
const token=new URLSearchParams(location.search).get("token");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const n=v=>typeof v==="number"?v.toFixed(4):"—";
async function load(){const r=await fetch("/api/share?token="+encodeURIComponent(token||""));const x=await r.json();if(!r.ok)throw Error(x.error||"Report not found");const q=x.result||x;
document.getElementById("title").textContent=q.comparisonType==="robot-behavior-evaluation"?"Unitree G1 Pick & Place":q.benchmark||"Evaluation";
document.getElementById("meta").textContent=[q.engine,q.behaviorId&&("Behavior "+q.behaviorId),q.behaviorVersion&&("Version "+q.behaviorVersion),q.runCount&&q.expectedRunCount?(q.runCount+"/"+q.expectedRunCount+" runs"):null].filter(Boolean).join(" · ");
if(q.comparisonType==="robot-behavior-evaluation"){document.getElementById("summary").innerHTML="<div><strong>"+((Number(q.successRate||0)*100).toFixed(1))+"%</strong><span>Task success</span></div><div><strong>"+n(q.summary?.completionTimeMean)+"s</strong><span>Completion time</span></div><div><strong>"+n(q.summary?.controlCostMean)+"</strong><span>Control cost</span></div><div><strong>"+n(q.summary?.maxTiltRadMean)+"</strong><span>Max tilt</span></div>"}else{document.getElementById("summary").innerHTML=(q.policies||[]).map(p=>"<div><strong>"+n(q.summary?.[p]?.survival_rate?.mean)+"</strong><span>"+p+" survival</span></div>").join("")}
document.getElementById("details").innerHTML="<p><b>Measured:</b> "+(q.measured?"Yes":"No / illustrative")+"</p><p><b>Reproducible:</b> "+(q.reproducible?"Yes":"—")+"</p><p><b>Status:</b> "+esc(x.status||"completed")+"</p>";const p=q.provenance||{};document.getElementById("provenance").innerHTML="<p><b>Behavior:</b> "+esc(q.behaviorId||"—")+" · <b>Version:</b> "+esc(q.behaviorVersion||"—")+"</p><p><b>Engine:</b> "+esc(q.engine||"—")+" "+esc(p.engineVersion||"")+" · <b>Worker:</b> "+esc(p.worker||"—")+"</p><p><b>Seeds:</b> "+esc((q.seeds||[]).join(", "))+" · <b>Policies:</b> "+esc((q.policies||[]).join(", "))+" · <b>Duration:</b> "+esc(String(q.seconds||"—"))+" s</p><p><b>Compute build:</b> "+esc(p.computeBuild||"—")+" · <b>Completed:</b> "+esc(q.completedAt||"—")+"</p>";document.getElementById("download-csv").onclick=()=>{const rows=q.rawResults||[];const keys=[...new Set(rows.flatMap(v=>Object.keys(v)))];const csv=[keys.join(","),...rows.map(v=>keys.map(k=>JSON.stringify(v[k]??"")).join(","))].join("\n");const blob=new Blob([csv],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="humanoidbehavior-shared-"+(q.id||"experiment")+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById("raw").textContent=JSON.stringify(x,null,2)}
load().catch(e=>document.getElementById("title").textContent=e.message);
</script></body></html>
