<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Developer Access — HumanoidBehavior</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-page"><div class="auth-card"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><div class="eyebrow">DEVELOPER ACCESS</div><h1>Enter the workspace.</h1><p>Create an account or sign in to run experiments and manage API keys.</p><input id="email" type="email" placeholder="Email" style="width:100%;padding:12px;margin:6px 0;border:1px solid #d5d8dd;border-radius:8px"><input id="password" type="password" placeholder="Password (8+ characters)" style="width:100%;padding:12px;margin:6px 0 14px;border:1px solid #d5d8dd;border-radius:8px"><div class="actions"><button id="signup" class="button primary">Create account</button><button id="login" class="button secondary">Sign in</button></div><button id="demo" class="button" style="margin-top:12px">Use demo (if enabled)</button><div id="status"></div></div></main><script>
async function go(path){const status=document.getElementById("status");status.textContent="Working…";try{const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})}),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");localStorage.setItem("hb_token",d.token);localStorage.setItem("hb_user",JSON.stringify(d.user));location.href="dashboard.html"}catch(e){status.textContent=e.message}}
signup.onclick=()=>go("/api/auth/signup");login.onclick=()=>go("/api/auth/login");demo.onclick=async()=>{const r=await fetch("/api/auth/demo",{method:"POST"}),d=await r.json();if(!r.ok){status.textContent=d.error||"Demo auth disabled"}else{localStorage.setItem("hb_token",d.token);localStorage.setItem("hb_user",JSON.stringify(d.user));location.href="dashboard.html"}};

async function startPlanCheckout(){const plan=new URLSearchParams(location.search).get("plan");if(!plan)return;const t=localStorage.getItem("hb_token");if(!t)return;try{const r=await fetch("/api/billing/checkout",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({plan})}),d=await r.json();if(!r.ok)throw Error(d.error||"Checkout unavailable");location.href=d.url}catch(e){status.textContent=e.message}}\nstartPlanCheckout();\n</script></body></html>
