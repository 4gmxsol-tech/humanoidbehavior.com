<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Developer Access — HumanoidBehavior</title><link rel="stylesheet" href="styles.css">  <script src="api-base.js"></script>
</head><body><main class="auth-page"><div class="auth-card"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><div class="eyebrow">DEVELOPER ACCESS</div><h1>Enter the workspace.</h1><p>Create an account or sign in to run experiments and manage API keys.</p><input id="email" type="email" placeholder="Email" style="width:100%;padding:12px;margin:6px 0;border:1px solid #d5d8dd;border-radius:8px"><input id="password" type="password" placeholder="Password (8+ characters)" style="width:100%;padding:12px;margin:6px 0 14px;border:1px solid #d5d8dd;border-radius:8px"><div class="actions"><button id="signup" class="button primary">Create account</button><button id="login" class="button secondary">Sign in</button></div><button id="demo" class="button" style="margin-top:12px">Use demo (if enabled)</button><div id="status" aria-live="polite" style="min-height:24px;margin-top:12px;font-size:14px;font-weight:600"></div></div></main><script>
const emailInput=document.getElementById("email");
const passwordInput=document.getElementById("password");
const statusEl=document.getElementById("status");
const signupButton=document.getElementById("signup");
const loginButton=document.getElementById("login");
const demoButton=document.getElementById("demo");
async function go(path){statusEl.textContent="Working…";statusEl.style.color="inherit";try{const r=await fetch("https://humanoidbehavior-com.4gmxsol.workers.dev"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:emailInput.value.trim(),password:passwordInput.value})}),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");localStorage.setItem("hb_token",d.token);localStorage.setItem("hb_user",JSON.stringify(d.user));const plan=new URLSearchParams(location.search).get("plan");if(plan&&["pro","team"].includes(plan)){try{const r=await fetch("/api/billing/checkout",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+d.token},body:JSON.stringify({plan})}),x=await r.json();if(!r.ok)throw Error(x.error||"Checkout unavailable");location.href=x.url;return}catch(e){statusEl.textContent=e.message;return}}location.href="dashboard.html"}catch(e){statusEl.textContent=e.message}}
signupButton.onclick=()=>go("/api/auth/signup");loginButton.onclick=()=>go("/api/auth/login");demoButton.onclick=async()=>{statusEl.textContent="Working…";try{const r=await fetch("https://humanoidbehavior-com.4gmxsol.workers.dev/api/auth/demo",{method:"POST"}),d=await r.json();if(!r.ok){statusEl.textContent=d.error||"Demo auth disabled"}else{localStorage.setItem("hb_token",d.token);localStorage.setItem("hb_user",JSON.stringify(d.user));location.href="dashboard.html"}}catch(e){statusEl.textContent=e.message}};

async function startPlanCheckout(){const plan=new URLSearchParams(location.search).get("plan");if(!plan)return;const t=localStorage.getItem("hb_token");if(!t)return;try{const r=await fetch("/api/billing/checkout",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({plan})}),d=await r.json();if(!r.ok)throw Error(d.error||"Checkout unavailable");location.href=d.url}catch(e){status.textContent=e.message}}\nstartPlanCheckout();\n</script></body></html>
