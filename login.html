<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Developer Access — HumanoidBehavior</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-page"><div class="auth-card"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><div class="eyebrow">DEVELOPER ACCESS</div><h1>Enter the workspace.</h1><p>Start a free local development session to run benchmarks and explore the platform.</p><button id="login" class="button primary">Continue with demo account</button><div id="status"></div></div></main><script>document.querySelector("#login").onclick=async()=>{const s=document.querySelector("#status");s.textContent="Creating workspace…";const r=await fetch("/api/auth/demo",{method:"POST"});const d=await r.json();localStorage.setItem("hb_token",d.token);localStorage.setItem("hb_user",JSON.stringify(d.user));location.href="dashboard.html"};</script></body></html>
