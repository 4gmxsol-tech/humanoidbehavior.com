services:
  - type: web
    name: humanoidbehavior-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_URL
        value: https://humanoidbehavior.com
      - key: DATABASE_URL
        fromDatabase:
          name: humanoidbehavior-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    domains:
      - api.humanoidbehavior.com

  - type: worker
    name: humanoidbehavior-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: humanoidbehavior-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: WORKER_POLL_MS
        value: "1000"
      - key: MUJOCO_PYTHON
        value: python3
    autoDeployTrigger: checksPass

databases:
  - name: humanoidbehavior-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
