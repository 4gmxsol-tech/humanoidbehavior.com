<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Discover, version and publish reusable humanoid robot behaviors."><title>Behavior Registry — HumanoidBehavior</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><nav><a class="active" href="registry.html">Registry</a><a href="behaviors.html">Behaviors</a><a href="benchmark.html">Benchmark</a><a href="dashboard.html">Workspace</a></nav></header><main class="page"><div class="eyebrow">BEHAVIOR REGISTRY</div><h1>Discover reusable robot behaviors.</h1><p class="lead">Search published behavior packages, inspect versions and build on reproducible specifications.</p><div class="toolbar"><input id="registry-search" placeholder="Search published behaviors…" aria-label="Search registry"><button class="button primary" id="registry-refresh">Search</button></div><div id="registry-list" class="library-grid"></div></main><script src="app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const q=document.querySelector("#registry-search"),list=document.querySelector("#registry-list");async function load(){list.innerHTML='<div class="empty">Loading registry…</div>';const r=await fetch("/api/behaviors?q="+encodeURIComponent(q.value));const d=await r.json();list.innerHTML=d.data?.length?d.data.map(x=>'<article class="behavior-card"><div class="card-top"><span class="pill">'+(x.package?.category||"Behavior")+'</span><span class="pill">v'+x.version+'</span></div><h3>'+x.name+'</h3><p>'+x.description+'</p><div class="card-bottom"><span>'+x.status+'</span><a href="behavior.html?id='+encodeURIComponent(x.id)+'&version='+encodeURIComponent(x.version)+'">View</a></div></article>').join(""):'<div class="empty">No published behaviors found.</div>'}document.querySelector("#registry-refresh").onclick=load;q.addEventListener("keydown",e=>{if(e.key==="Enter")load()});load()})</script></body></html>
