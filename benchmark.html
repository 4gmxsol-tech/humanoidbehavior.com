<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benchmark — HumanoidBehavior</title><link rel="stylesheet" href="styles.css">  <script src="api-base.js"></script>
</head><body><header class="nav"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><nav><a href="behaviors.html">Behaviors</a><a class="active" href="benchmark.html">Benchmark</a><a href="simulation.html">Simulation</a><a href="dashboard.html">Workspace</a></nav><a class="nav-cta" href="simulation.html">Run simulation</a></header><main class="page"><div class="eyebrow">BENCHMARK ENGINE</div><h1>Compare policies on the same task.</h1><p class="lead">Run reproducible comparisons and inspect measured MuJoCo experiment statistics, confidence intervals, and every raw run.</p><div class="builder-result"><div class="toolbar"><select id="seed"><option>42</option><option>1337</option><option>2026</option></select><select id="seconds"><option value="5">5 seconds</option><option value="10">10 seconds</option></select><button class="button primary" id="run">Run comparison</button><button class="button" id="load-latest">Load latest experiment</button></div><div id="status" class="eyebrow">READY</div><div id="experiment-meta" class="lead"></div><div id="summary" class="metric-grid"></div><div id="table-wrap"></div><details><summary>Raw experiment JSON</summary><pre id="raw" style="background:#111318;color:#e5e7ea;padding:20px;border-radius:10px;overflow:auto">Ready.</pre></details></div></main><script>
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function renderExperiment(x){
 document.getElementById("status").textContent=x.validation?.passed?"VALIDATED EXPERIMENT":"UNVALIDATED";
 document.getElementById("experiment-meta").textContent=`${x.engine} · ${x.runCount||0}/${x.expectedRunCount||0} runs · seeds: ${(x.seeds||[]).join(", ")} · target: ${x.targetSeconds}s`;
 document.getElementById("summary").innerHTML=(x.policies||[]).map(p=>{const s=x.summary[p];return `<div><strong>${(s.survival_rate??s.survivalRate).mean.toFixed(4)}</strong><span>${p} mean survival</span></div><div><strong>${(s.control_cost??s.controlCost).mean.toFixed(5)}</strong><span>${p} mean control cost</span></div><div><strong>${(s.fallRate*100).toFixed(0)}%</strong><span>${p} fall rate</span></div>`}).join("");
 document.getElementById("table-wrap").innerHTML=`<div style="overflow:auto"><table><thead><tr><th>Policy</th><th>Survival mean</th><th>95% CI</th><th>Simulated s</th><th>Control cost</th><th>Max tilt</th></tr></thead><tbody>${x.policies.map(p=>{const s=x.summary[p];return `<tr><td>${esc(p)}</td><td>${s.survival_rate.mean}</td><td>${(s.survival_rate??s.survivalRate).ci95.low} — ${(s.survival_rate??s.survivalRate).ci95.high}</td><td>${(s.simulated_seconds??s.simulatedSeconds).mean}</td><td>${(s.control_cost??s.controlCost).mean}</td><td>${(s.max_tilt_rad??s.maxTiltRad).mean}</td></tr>`}).join("")}</tbody></table></div>`;
 document.getElementById("raw").textContent=JSON.stringify(x,null,2);
}
async function loadLatest(){const s=document.getElementById("status");s.textContent="LOADING…";try{const r=await fetch("data/latest-mujoco-experiment.json");if(!r.ok)throw Error("Latest experiment not found");renderExperiment(await r.json())}catch(e){s.textContent=e.message}}
async function saveLatest(){const token=localStorage.getItem("hb_token");if(!token)return;try{const x=await (await fetch("data/latest-mujoco-experiment.json")).json();const r=await fetch("/api/experiments",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({benchmark:x.benchmark,engine:x.engine,status:"completed",result:x})});if(r.ok){const e=await r.json();document.getElementById("status").innerHTML='SAVED · <a href="experiment.html?id='+encodeURIComponent(e.id)+'">Open experiment</a>'}}catch(e){}} 
document.getElementById("load-latest").onclick=loadLatest;
document.getElementById("run").onclick=async()=>{const out=document.getElementById("raw"),summary=document.getElementById("summary");out.textContent="Running…";summary.innerHTML="";const token=localStorage.getItem("hb_token");try{const r=await fetch("/api/simulation/compare",{method:"POST",headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:JSON.stringify({seed:document.getElementById("seed").value,seconds:Number(document.getElementById("seconds").value)})});const x=await r.json();if(!r.ok)throw Error(x.error||"Benchmark failed");out.textContent=JSON.stringify(x,null,2);summary.innerHTML=(x.results||[]).map(v=>`<div><strong>${v.metrics.survivalRate}</strong><span>${v.policy} survival</span></div><div><strong>${v.metrics.controlCost}</strong><span>control cost</span></div>`).join("")}catch(e){out.textContent=e.message}};
loadLatest();saveLatest();
</script></body></html>
