<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benchmark — HumanoidBehavior</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><nav><a href="behaviors.html">Behaviors</a><a class="active" href="benchmark.html">Benchmark</a><a href="simulation.html">Simulation</a><a href="dashboard.html">Workspace</a></nav><a class="nav-cta" href="simulation.html">Run simulation</a></header><main class="page"><div class="eyebrow">BENCHMARK ENGINE</div><h1>Compare policies on the same task.</h1><p class="lead">Use identical seeds and environments so Model A and Model B are evaluated under the same conditions.</p><div class="builder-result"><h2>Comparison</h2><div class="toolbar"><select id="seed"><option>42</option><option>1337</option><option>2026</option></select><select id="seconds"><option value="5">5 seconds</option><option value="10">10 seconds</option></select><button class="button primary" id="run">Run comparison</button></div><div id="summary" class="metric-grid"></div><pre id="raw" style="background:#111318;color:#e5e7ea;padding:20px;border-radius:10px;overflow:auto">Ready.</pre></div></main><script>document.getElementById("run").onclick=async()=>{const out=document.getElementById("raw"),summary=document.getElementById("summary");out.textContent="Running…";const token=localStorage.getItem("hb_token");try{const r=await fetch("/api/simulation/compare",{method:"POST",headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:JSON.stringify({seed:document.getElementById("seed").value,seconds:Number(document.getElementById("seconds").value)})});const x=await r.json();summary.innerHTML=(x.results||[]).map(v=>'<div><strong>'+v.metrics.survivalRate+'</strong><span>'+v.policy+' survival</span></div><div><strong>'+v.metrics.controlCost+'</strong><span>control cost</span></div>').join("");out.textContent=JSON.stringify(x,null,2)}catch(e){out.textContent=e.message}};</script></body></html>
