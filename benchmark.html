<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benchmark — HumanoidBehavior</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="styles.css"><script src="api-base.js"></script></head><body><a class="skip-link" href="#main-content">Skip to content</a><header class="nav"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><nav><a href="behaviors.html">Behaviors</a><a class="active" href="benchmark.html">Benchmark</a><a href="simulation.html">Simulation</a><a href="builder.html">Builder</a><a href="dashboard.html">Workspace</a></nav><a class="nav-cta" href="simulation.html">Run evaluation</a></header><main id="main-content" class="page"><div class="eyebrow">BENCHMARK ENGINE</div><h1>Run a reproducible benchmark.</h1><p class="lead">Launch a measured MuJoCo evaluation with explicit seeds and policies. Every run is stored in your workspace.</p><section class="builder-result"><div class="toolbar"><select id="behavior" aria-label="Behavior"><option value="pick-place">Pick &amp; Place</option><option value="open-door">Open a Door</option><option value="follow-person">Follow a Person</option></select><input id="seeds" value="42,1337,2026,7,99" aria-label="Seeds"><input id="policies" value="policy-a" aria-label="Policies"><select id="seconds" aria-label="Duration"><option value="5">5 seconds</option><option value="10">10 seconds</option></select><button class="button primary" id="run">Run benchmark</button></div><div id="status" class="eyebrow">READY</div><p id="message" class="lead"></p><div id="summary" class="metric-grid"></div><div id="table-wrap"></div><details><summary>Raw experiment JSON</summary><pre id="raw" class="code-block">Ready.</pre></details></section></main><script>
const token=localStorage.getItem("hb_token"),$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
async function api(path,options={}){const r=await fetch(path,{...options,headers:{Accept:"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(options.headers||{})}});const x=await r.json();if(!r.ok)throw Error(x.error||"Request failed");return x}
async function run(){if(!token){$("message").textContent="Sign in to run a measured benchmark.";return}const btn=$("run");btn.disabled=true;$("status").textContent="QUEUING…";$("message").textContent="Creating evaluation…";try{const seeds=$("seeds").value.split(",").map(x=>x.trim()).filter(Boolean),policies=$("policies").value.split(",").map(x=>x.trim()).filter(Boolean);const x=await api("/api/experiments/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({behaviorId:$("behavior").value,behaviorVersion:$("behavior").value==="pick-place"?"1.1.0":"1.0.0",engine:"MuJoCo",seeds,policies,seconds:Number($("seconds").value)})});location.href="experiment.html?id="+encodeURIComponent(x.id)}catch(e){$("status").textContent="ERROR";$("message").textContent=e.message}finally{btn.disabled=false}}
$("run").onclick=run;
</script></body></html>
