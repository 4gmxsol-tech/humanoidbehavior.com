<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace — HumanoidBehavior</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><nav><a href="behaviors.html">Behaviors</a><a href="benchmark.html">Benchmark</a><a href="builder.html">Builder</a><a class="active" href="dashboard.html">Workspace</a></nav></header><main class="page"><div class="eyebrow">WORKSPACE</div><h1>Experiments & evaluation runs.</h1><p class="lead">Persistent benchmark history for your account.</p><section class="builder-result"><h2>Experiments</h2><div class="toolbar"><button class="button" id="refresh">Refresh</button><button class="button primary" id="compare">Compare selected</button></div><div id="experiments"></div></section><section class="builder-result"><h2>Evaluation runs</h2><div class="run-table"><div class="run-row head"><span>Behavior</span><span>Run time</span><span>Status</span><span>Success</span></div><div id="runs"></div></div></section></main><script>
const token=localStorage.getItem("hb_token"),headers=token?{Authorization:"Bearer "+token}:{};async function load(){try{const [er,rr]=await Promise.all([fetch("/api/experiments",{headers}),fetch("/api/runs",{headers})]);const e=await er.json(),r=await rr.json();document.getElementById("experiments").innerHTML=(e.data||[]).map(x=>`<div class="run-row"><input type="checkbox" class="exp" value="${x.id}"><span><b>${x.benchmark}</b><br><small>${x.engine} · ${x.status}</small></span><span>${x.result?.runCount||0} runs</span><span>${new Date(x.createdAt).toLocaleString()}</span><a class="button" href="experiment.html?id=${encodeURIComponent(x.id)}">Open</a></div>`).join("")||"<div class='empty'>No experiments yet.</div>";document.getElementById("runs").innerHTML=(r.data||[]).map(x=>`<div class="run-row"><span>${x.behaviorId||x.benchmark||"Run"}</span><span>${new Date(x.createdAt||Date.now()).toLocaleString()}</span><strong>${x.status||"completed"}</strong><span>${x.metrics?.success??"—"}</span></div>`).join("")||"<div class='empty'>No evaluation runs yet.</div>"}catch(e){document.getElementById("experiments").innerHTML="<div class='empty'>Please sign in to view your workspace.</div>"}}document.getElementById("refresh").onclick=load;document.getElementById("compare").onclick=()=>{const ids=[...document.querySelectorAll(".exp:checked")].map(x=>x.value);if(ids.length<2)return alert("Select at least two experiments.");location.href="compare.html?ids="+encodeURIComponent(ids.join(","))};load();</script></body></html>
