<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare Experiments — HumanoidBehavior</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><nav><a href="behaviors.html">Behaviors</a><a class="active" href="benchmark.html">Benchmark</a><a href="dashboard.html">Workspace</a></nav></header><main class="page"><div class="eyebrow">EXPERIMENT COMPARISON</div><h1>Compare experiment history.</h1><p class="lead">Compare the same metrics across saved experiments.</p><div id="content" class="builder-result">Loading…</div></main><script>
const token=localStorage.getItem("hb_token"),ids=new URLSearchParams(location.search).get("ids")||"";fetch("/api/experiments/compare?ids="+encodeURIComponent(ids),{headers:token?{Authorization:"Bearer "+token}:{}}).then(r=>r.json()).then(x=>{const e=x.data||[];if(!e.length){content.textContent="No experiments found.";return}content.innerHTML=e.map(a=>{const r=a.result||a;return `<section><h2>${r.benchmark} · ${r.engine}</h2><p>${r.runCount||0} runs · ${new Date(a.createdAt).toLocaleString()}</p><table><thead><tr><th>Policy</th><th>Survival</th><th>Control cost</th><th>Fall rate</th><th>Max tilt</th></tr></thead><tbody>${(r.policies||[]).map(p=>{const s=r.summary[p];return `<tr><td>${p}</td><td>${(s.survival_rate??s.survivalRate).mean}</td><td>${(s.control_cost??s.controlCost).mean}</td><td>${(s.fallRate*100).toFixed(0)}%</td><td>${(s.max_tilt_rad??s.maxTiltRad).mean}</td></tr>`}).join("")}</tbody></table></section>`}).join("")}).catch(e=>content.textContent=e.message);</script></body></html>
