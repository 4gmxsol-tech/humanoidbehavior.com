<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare — HumanoidBehavior</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><nav><a href="behaviors.html">Behaviors</a><a class="active" href="benchmark.html">Benchmark</a><a href="dashboard.html">Workspace</a></nav></header><main class="page"><div class="eyebrow">BEHAVIOR VERSION COMPARISON</div><h1>Compare behavior versions.</h1><p class="lead">Run the same seeds and policies against two published MuJoCo behavior versions, then inspect paired deltas and confidence intervals.</p><div id="content" class="builder-result">Loading…</div></main><script>
const token=localStorage.getItem("hb_token"),q=new URLSearchParams(location.search),ids=q.get("ids")||"",content=document.getElementById("content");
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function num(v){return typeof v==="number"?v.toFixed(4):"—"}
function render(e){const r=e.result||{};const versions=r.versions||[];const rows=r.pairedDeltas||[];const ds=r.deltaSummary||{};let h='<div class="compare-meta"><strong>'+esc(r.behaviorId||r.benchmark)+'</strong><span>'+versions.map(esc).join(' vs ')+'</span><span>'+esc(r.engine)+' · '+(r.runCount||0)+' runs</span><span class="pill">'+esc(r.status||e.status||"queued")+'</span></div>';
if(ds&&Object.keys(ds).length){h+='<h2>Paired delta summary</h2><p class="muted">Delta = '+esc(versions[1]||"B")+' − '+esc(versions[0]||"A")+'.</p><table><thead><tr><th>Metric</th><th>Mean Δ</th><th>Stddev</th><th>95% CI</th></tr></thead><tbody>';for(const [k,v] of Object.entries(ds))h+='<tr><td>'+esc(k)+'</td><td>'+num(v.mean)+'</td><td>'+num(v.stddev)+'</td><td>['+num(v.ci95?.low)+', '+num(v.ci95?.high)+']</td></tr>';h+='</tbody></table>'}
if(rows.length){h+='<h2>Paired runs</h2><table><thead><tr><th>Seed</th><th>Policy</th><th>Task Δ</th><th>Cost Δ</th><th>Time Δ</th><th>Survival Δ</th></tr></thead><tbody>';for(const x of rows)h+='<tr><td>'+esc(x.seed)+'</td><td>'+esc(x.policy)+'</td><td>'+num(x.taskSuccessDelta)+'</td><td>'+num(x.controlCostDelta)+'</td><td>'+num(x.completionTimeDelta)+'</td><td>'+num(x.survivalRateDelta)+'</td></tr>';h+='</tbody></table>'}
return h}
async function load(){if(!ids){content.innerHTML='<div class="empty">Provide two experiment IDs in the URL.</div>';return}try{const r=await fetch("/api/experiments/compare?ids="+encodeURIComponent(ids),{headers:token?{Authorization:"Bearer "+token}:{}});const x=await r.json();const e=x.data||[];if(!e.length){content.innerHTML='<div class="empty">No experiments found.</div>';return}content.innerHTML=e.map(render).join('<hr>')}catch(err){content.innerHTML='<div class="empty">'+esc(err.message)+'</div>'}}load();</script></body></html>
