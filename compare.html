<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare — HumanoidBehavior</title><link rel="stylesheet" href="styles.css">  <script src="api-base.js"></script>
</head><body><header class="nav"><a class="brand" href="index.html">Humanoid<span>Behavior</span></a><nav><a href="behaviors.html">Behaviors</a><a class="active" href="benchmark.html">Benchmark</a><a href="dashboard.html">Workspace</a></nav></header><main class="page"><div class="eyebrow">BEHAVIOR VERSION COMPARISON</div><h1>Compare behavior versions.</h1><p class="lead">Run identical seeds and policies against two published MuJoCo behavior versions and inspect paired deltas with confidence intervals.</p><section class="builder-result"><h2>Launch comparison</h2><div class="toolbar"><select id="behavior" aria-label="Behavior"></select><select id="v1" aria-label="Version 1"></select><select id="v2" aria-label="Version 2"></select></div><div class="toolbar"><input id="seeds" value="42,1337,2026,7,99" placeholder="Seeds, comma separated"><input id="policies" value="policy-a,policy-b" placeholder="Policies, comma separated"><input id="seconds" type="number" min="1" max="60" value="10" placeholder="Seconds"><button class="button primary" id="launch">Run MuJoCo comparison</button></div><p id="launch-status" class="muted"></p></section><div id="content" class="builder-result">Select a behavior and two versions to begin.</div></main><script>
const token=localStorage.getItem("hb_token"),q=new URLSearchParams(location.search),initialIds=q.get("ids")||"",initialBehavior=q.get("behavior")||"",initialV1=q.get("v1")||"",initialV2=q.get("v2")||"",content=document.getElementById("content"),headers=()=>token?{Authorization:"Bearer "+token}:{};function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}function num(v){return typeof v==="number"?v.toFixed(4):"—"}
async function json(url,opts={}){const r=await fetch(url,{...opts,headers:{...headers(),...(opts.headers||{})}});const x=await r.json();if(!r.ok)throw Error(x.error||"Request failed");return x}
function render(e){const r=e.result||e,versions=r.versions||[];const rows=r.pairedDeltas||[],ds=r.deltaSummary||{};let h='<div class="compare-meta"><strong>'+esc(r.behaviorId||r.benchmark)+'</strong><span>'+versions.map(esc).join(' vs ')+'</span><span>'+esc(r.engine||"MuJoCo")+' · '+(r.runCount||0)+' runs</span><span class="pill">'+esc(r.status||e.status||"queued")+'</span></div>';if(r.status==="queued"||r.status==="running")return h+'<p>Worker is evaluating the paired matrix. This report will refresh automatically.</p>';if(r.status==="failed")return h+'<p class="empty">'+esc(r.validation?.message||e.error||"Comparison failed")+'</p>';if(ds&&Object.keys(ds).length){h+='<h2>Paired delta summary</h2><p class="muted">Delta = '+esc(versions[1]||"B")+' − '+esc(versions[0]||"A")+'. CI is a descriptive paired 95% interval.</p><table><thead><tr><th>Metric</th><th>Mean Δ</th><th>Stddev</th><th>95% CI</th></tr></thead><tbody>';for(const [k,v] of Object.entries(ds))h+='<tr><td>'+esc(k)+'</td><td>'+num(v.mean)+'</td><td>'+num(v.stddev)+'</td><td>['+num(v.ci95?.low)+', '+num(v.ci95?.high)+']</td></tr>';h+='</tbody></table>'}if(rows.length){h+='<h2>Paired runs</h2><table><thead><tr><th>Seed</th><th>Policy</th><th>Task Δ</th><th>Cost Δ</th><th>Time Δ</th><th>Survival Δ</th></tr></thead><tbody>';for(const x of rows)h+='<tr><td>'+esc(x.seed)+'</td><td>'+esc(x.policy)+'</td><td>'+num(x.taskSuccessDelta)+'</td><td>'+num(x.controlCostDelta)+'</td><td>'+num(x.completionTimeDelta)+'</td><td>'+num(x.survivalRateDelta)+'</td></tr>';h+='</tbody></table>'}return h}
async function loadVersions(id){const x=await json("/api/behaviors/"+encodeURIComponent(id)+"/versions");const vs=x.data||x.versions||[];const a=document.getElementById("v1"),b=document.getElementById("v2");a.innerHTML=b.innerHTML=vs.map(v=>{const id=typeof v==="string"?v:v.version;return '<option value="'+esc(id)+'">'+esc(id)+'</option>'}).join("");if(vs.length>1)b.selectedIndex=1}
async function init(){try{const x=await json("/api/behaviors"),items=x.data||[];const select=document.getElementById("behavior");select.innerHTML=items.map(v=>'<option value="'+esc(v.id)+'">'+esc(v.name||v.id)+'</option>').join("");if(!items.length)throw Error("No public behaviors available");select.onchange=()=>loadVersions(select.value);if(initialBehavior&&items.some(v=>v.id===initialBehavior))select.value=initialBehavior;await loadVersions(select.value);if(initialV1&&[...document.getElementById("v1").options].some(o=>o.value===initialV1))document.getElementById("v1").value=initialV1;if(initialV2&&[...document.getElementById("v2").options].some(o=>o.value===initialV2))document.getElementById("v2").value=initialV2;if(initialIds){const d=await json("/api/experiments/compare?ids="+encodeURIComponent(initialIds));const e=d.data||[];if(e.length)content.innerHTML=e.map(render).join("<hr>")}}catch(e){content.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
document.getElementById("launch").onclick=async()=>{const out=document.getElementById("launch-status"),btn=document.getElementById("launch");try{if(!token)throw Error("Sign in to run a comparison.");const seeds=document.getElementById("seeds").value.split(",").map(x=>x.trim()).filter(Boolean);const policies=document.getElementById("policies").value.split(",").map(x=>x.trim()).filter(Boolean);const seconds=Math.min(60,Math.max(1,Number(document.getElementById("seconds").value)||10));if(seeds.length<1||seeds.length>20)throw Error("Use 1–20 seeds.");if(policies.length<1)throw Error("Provide at least one policy.");btn.disabled=true;out.textContent="Creating durable MuJoCo comparison…";const x=await json("/api/behaviors/compare/benchmark",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({behaviorId:document.getElementById("behavior").value,versions:[document.getElementById("v1").value,document.getElementById("v2").value],seeds,policies,seconds})});const id=x.experimentId||x.data?.experimentId||x.experiment?.id;if(!id)throw Error("Comparison created but no experiment ID was returned.");history.replaceState(null,"","compare.html?ids="+encodeURIComponent(id));out.textContent="Comparison queued. Waiting for MuJoCo worker…";await poll(id)}catch(e){out.textContent=e.message}finally{btn.disabled=false}};
async function poll(id){for(let i=0;i<90;i++){try{const x=await json("/api/experiments/"+encodeURIComponent(id));content.innerHTML=render(x);if(x.status==="completed"||x.status==="failed"){document.getElementById("launch-status").textContent=x.status==="completed"?"Comparison completed.":"Comparison failed.";return}document.getElementById("launch-status").textContent="Worker status: "+(x.status||"queued")+" · refreshing…";await new Promise(r=>setTimeout(r,2000))}catch(e){document.getElementById("launch-status").textContent=e.message;return}}document.getElementById("launch-status").textContent="Still running. Open the experiment from Workspace to continue monitoring."}
init();</script></body></html>
